name: Nest.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show workspace path (debugging)
        run: |
          echo "GitHub workspace is: ${{ github.workspace }}"
          ls -la ${{ github.workspace }}

      - name: Sync code to custom directory
        run: |
          rm -rf /home/administrator/nest-ci-cd-pipeline/ci-cd-project
          cp -r ${{ github.workspace }} /home/administrator/nest-ci-cd-pipeline/ci-cd-project

      - name: Install dependencies
        run: npm install
        working-directory: /home/administrator/nest-ci-cd-pipeline/ci-cd-project

      - name: Build the project
        run: npm run build
        working-directory: /home/administrator/nest-ci-cd-pipeline/ci-cd-project

      - name: Install PM2 globally
        run: npm install -g pm2

      - name: Delete existing PM2 process
        run: pm2 delete nestjs-app || true

      - name: Start PM2 with new build
        run: pm2 start dist/main.js --name nestjs-app
        working-directory: /home/administrator/nest-ci-cd-pipeline/ci-cd-project

      - name: Save PM2 process list
        run: pm2 save
