name: Nest.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install & Build in Workspace
        run: |
          npm ci
          npm run build
        working-directory: ${{ github.workspace }}

      - name: Stop existing PM2 process
        run: pm2 delete nestjs-app || true

      - name: Sync production artifacts with rsync
        run: |
          # Create target directory if missing
          mkdir -p /home/administrator/nest-ci-cd-pipeline/ci-cd-project/
          
          # Sync only essential files
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            ${{ github.workspace }/ \
            /home/administrator/nest-ci-cd-pipeline/ci-cd-project/

      - name: Install production dependencies
        run: npm ci --production
        working-directory: /home/administrator/nest-ci-cd-pipeline/ci-cd-project/

      - name: Start PM2 process
        run: |
          pm2 start dist/main.js --name nestjs-app
          pm2 save
        working-directory: /home/administrator/nest-ci-cd-pipeline/ci-cd-project/